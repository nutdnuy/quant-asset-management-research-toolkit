[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "quant-asset-management-research-toolkit"
version = "0.1.0"
description = "Generic, reproducible quant asset-management research components."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Nuthdanai" }]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Financial and Insurance Industry",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Typing :: Typed",
]
dependencies = [
  "numpy>=1.26,<2.5",
  "scipy>=1.11",
]

[project.optional-dependencies]
pandas = ["pandas>=2.1"]
dev = [
  "build>=1.2",
  "hypothesis>=6.108",
  "mypy>=1.11",
  "pandas>=2.1",
  "pandas-stubs>=2.1",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/qamr"]

[tool.hatch.build.targets.sdist]
include = [
  "README.md",
  "pyproject.toml",
  "src/qamr",
]
exclude = [
  "/.coverage",
  "/.env",
  "/.env.*",
  "/.hypothesis",
  "/.mypy_cache",
  "/.pytest_cache",
  "/.ruff_cache",
  "/.venv",
  "/.worktrees",
  "/artifacts",
  "/build",
  "/dist",
  "/results",
  "/secrets",
  "/tests",
  "**/__pycache__",
  "**/*.py[cod]",
]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["qamr"]

[tool.coverage.report]
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["qamr"]

[[tool.mypy.overrides]]
module = ["pandas.*", "scipy.*"]
ignore_missing_imports = true
